# OpenJornada API - Unit Tests
# Ejecuta los tests unitarios en cada push y pull request.
# Los tests no requieren MongoDB ni servicios externos.

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run unit tests
        env:
          SECRET_KEY: test_secret_key_for_testing_only
          # api/database.py falla en import-time si no hay URL de BD (fail-fast).
          # --noconftest omite tests/conftest.py, que es quien la define en local.
          # Motor no conecta al importar: los unit tests no necesitan MongoDB real.
          MONGODB_URL: mongodb://localhost:27017
        run: python -m pytest tests/unit/ --noconftest -v
